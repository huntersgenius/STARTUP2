include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
  errors:
    invalid_annotation_target: ignore

linter:
  rules:
    - prefer_const_constructors
    - prefer_final_locals
    - avoid_print
    - unawaited_futures
    # `require_trailing_commas` is deliberately absent: it disagrees with
    # `dart format`, which is the formatter of record here, and the two fight
    # every time someone saves a file.
