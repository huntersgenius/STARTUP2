name: sihhatai
description: SihhatAI clinic app — offline-first clinical decision support for primary care in Uzbekistan.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State
  flutter_riverpod: ^2.5.1

  # Local store — the offline record of truth
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # Network + auth
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  connectivity_plus: ^6.0.5

  # Voice
  record: ^5.1.2
  permission_handler: ^11.3.1

  # Misc
  intl: ^0.19.0
  uuid: ^4.5.1
  collection: ^1.18.0
  printing: ^5.13.2
  pdf: ^3.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.13
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
