name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # Nightly full-set run against the model path, so the paid evaluation is
    # not tied to push frequency.
    - cron: "0 2 * * *"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests ../knowledge ../ml

      - name: Format check (ruff)
        run: ruff format --check app tests

      - name: Types (mypy)
        run: mypy app

      - name: Tests
        env:
          ENVIRONMENT: test
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80

      - name: De-identification red-team suite
        env:
          ENVIRONMENT: test
        # Run separately and loudly: this suite may never be skipped.
        run: pytest -m redteam --no-header -q

      - name: Migrations apply cleanly
        env:
          ENVIRONMENT: dev
          DATABASE_URL: "sqlite+pysqlite:///./ci.db"
        run: |
          alembic upgrade head
          alembic downgrade base

  eval:
    name: clinical evaluation gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Run evaluation suite
        env:
          ENVIRONMENT: test
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
          PYTHONPATH: ..
        # Fails the build below 70% top-3 accuracy or under 100% red-flag
        # recall. The recall floor is absolute: it is the safety metric.
        run: >
          python -m app.ai.eval.run --offline --html
          --fail-under-top3 0.70 --fail-under-redflag 1.0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: backend/app/ai/eval/results/

  eval-integrity:
    name: evaluation integrity (overlap + out-of-vocabulary)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Vocabulary overlap
        env:
          ENVIRONMENT: test
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
          PYTHONPATH: ..
        run: python -m app.ai.eval.overlap
      - name: Out-of-vocabulary and adversarial sets
        env:
          ENVIRONMENT: test
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
          PYTHONPATH: ..
        # No accuracy floor here on purpose: these sets exist to be reported,
        # not to be passed. The floors that gate a release are the red-flag
        # ones below, which apply to the sets where a miss is a safety event.
        run: |
          python -m app.ai.eval.run --offline --set oov
          python -m app.ai.eval.run --offline --set adversarial
          python -m app.ai.eval.run --offline --set injection \
            --fail-under-redflag 1.0

  eval-model:
    name: clinical evaluation — model path (key-gated)
    runs-on: ubuntu-latest
    # The paid path. Skipped with a visible message when no key is configured,
    # so the absence of a model number is never mistaken for a passing one.
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Announce whether the model path can be measured
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::warning title=Model path unmeasured::OPENAI_API_KEY is not configured."
            echo "The eight-stage engine is NOT evaluated by this run."
            echo "Only the deterministic rules baseline has been measured."
          else
            echo "OPENAI_API_KEY present; the model gate will run."
          fi
      - name: Model gate on a deterministic stratified subset
        if: ${{ env.OPENAI_API_KEY != '' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ENVIRONMENT: test
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
          PYTHONPATH: ..
        # Every must-not-miss case is always included; only the non-safety
        # cases are sampled. Red-flag recall is never measured on a sample.
        run: >
          python -m app.ai.eval.run --provider openai --set main --subset 2
          --fail-under-top3 0.70 --fail-under-redflag 1.0
      - name: Injection suite on the model path
        if: ${{ env.OPENAI_API_KEY != '' }}
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ENVIRONMENT: test
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
          PYTHONPATH: ..
        run: >
          python -m app.ai.eval.run --provider openai --set injection
          --fail-under-redflag 1.0

  eval-model-full:
    name: clinical evaluation — model path, full set (nightly)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ENVIRONMENT: test
          DATABASE_URL: "sqlite+pysqlite:///:memory:"
          PYTHONPATH: ..
        run: >
          python -m app.ai.eval.run --provider openai --set main --html
          --fail-under-top3 0.70 --fail-under-redflag 1.0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report-model
          path: backend/app/ai/eval/results/

  web:
    name: web admin (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci || npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  mobile:
    name: flutter app (analyze, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.x"
          channel: stable
      - run: flutter pub get
      # Drift sources are generated, not committed.
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: dart format --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
