name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (lint, types, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests ../knowledge

      - name: Format check (ruff)
        run: ruff format --check app tests

      - name: Types (mypy)
        run: mypy app

      - name: Tests
        env:
          ENVIRONMENT: test
          DATABASE_URL: sqlite+pysqlite:///:memory:
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80

      - name: De-identification red-team suite
        env:
          ENVIRONMENT: test
        # Run separately and loudly: this suite may never be skipped.
        run: pytest -m redteam --no-header -q

      - name: Migrations apply cleanly
        env:
          ENVIRONMENT: dev
          DATABASE_URL: sqlite+pysqlite:///./ci.db
        run: |
          alembic upgrade head
          alembic downgrade base

  eval:
    name: clinical evaluation gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Run evaluation suite
        env:
          ENVIRONMENT: test
          DATABASE_URL: sqlite+pysqlite:///:memory:
        # Fails the build below 70% top-3 accuracy or under 100% red-flag recall.
        run: python -m app.ai.eval.run --offline --fail-under-top3 0.70 --fail-under-redflag 1.0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: backend/app/ai/eval/results/

  web:
    name: web admin (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci || npm install
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  mobile:
    name: flutter app (analyze, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.x"
          channel: stable
      - run: flutter pub get
      - run: dart format --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
