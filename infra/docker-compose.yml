name: sihhatai

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sihhat
      POSTGRES_PASSWORD: sihhat
      POSTGRES_DB: sihhat
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sihhat -d sihhat"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    environment:
      ENVIRONMENT: dev
      DATABASE_URL: postgresql+psycopg://sihhat:sihhat@postgres:5432/sihhat
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-dev-only-insecure-secret-key-change-me}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:-ZGV2LW9ubHktaW5zZWN1cmUtcGlpLWtleS0zMmJ5dGU=}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-}
      BUILD_SHA: ${BUILD_SHA:-dev}
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    command: >
      sh -c "alembic upgrade head &&
             python -m app.seed --if-empty &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ../backend:/srv/backend
      - ../knowledge:/srv/knowledge

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    environment:
      SIHHAT_API_URL: http://backend:8000
    ports: ["3000:3000"]
    depends_on: [backend]

  mailhog:
    image: mailhog/mailhog:latest
    ports: ["1025:1025", "8025:8025"]

volumes:
  pgdata:
  redisdata:
